name: "General Issue"
description: "Report another issue that does not fit the available categories"
title: "[Issue]: "
labels: []
assignees: []

body:
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which part of Visor is this about?"
      options:
        - Voice agent builder
        - Calls and telephony
        - Models and providers
        - Campaigns
        - Account or billing
        - API or integrations
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Issue details"
      description: "Describe what happened, what you need, and any relevant non-sensitive context."
      placeholder: "Please describe the issue..."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Add screenshots, links, or other useful details."
