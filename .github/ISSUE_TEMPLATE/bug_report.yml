name: "Bug Report"
description: "Report a problem with the Visor platform"
title: "[Bug]: "
labels: [bug]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "Clearly describe what went wrong. Do not include passwords, API keys, or other secrets."
      placeholder: "The application..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Provide step-by-step instructions that reproduce the problem."
      placeholder: "1. Go to...\n2. Click...\n3. See the error"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Device, operating system, browser, and browser version."
      placeholder: "Desktop, Windows 11, Chrome 140"

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Add screenshots or other non-sensitive details that may help us investigate."
